<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 控制台 - 管理中心</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <style>
        :root {
            --primary: #6366f1; --primary-hover: #4f46e5; --bg: #f8fafc;
            --card-bg: #ffffff; --text: #1e293b; --text-muted: #64748b;
            --success: #10b981; --danger: #ef4444; --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 5px; text-align: center; color: var(--text); }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid var(--border); }
        .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        input[type="password"], input[type="text"], textarea, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; margin-bottom: 10px; transition: border-color 0.2s; font-family: inherit; }
        textarea { resize: vertical; min-height: 100px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background-color 0.2s, opacity 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 10px; }
        .btn-small { width: auto; padding: 8px 12px; font-size: 0.85rem; border-radius: 6px; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        
        .status-box { padding: 15px; border-radius: 8px; background-color: #f1f5f9; margin-top: 15px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--text-muted); flex-shrink: 0; }
        .status-dot.running { background-color: #f59e0b; animation: pulse 1.5s infinite; }
        .status-dot.success { background-color: var(--success); }
        .status-dot.failure { background-color: var(--danger); }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.7; } }

        /* 分類與檔案列表樣式 */
        .file-category { margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
        .file-category summary { padding: 12px 15px; background-color: #f8fafc; font-weight: bold; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; user-select: none; font-size: 0.95rem; border-bottom: 1px solid var(--border); }
        .file-category summary::-webkit-details-marker { display: none; }
        .file-category summary::after { content: '▼'; font-size: 0.8rem; color: var(--text-muted); transition: transform 0.2s; }
        .file-category[open] summary::after { transform: rotate(180deg); }
        .file-category-content { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        
        .file-item { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background-color: var(--card-bg); }
        .file-header { display: flex; justify-content: space-between; align-items: center; }
        .file-name { font-weight: bold; color: var(--primary); font-size: 0.95rem; word-break: break-all; }
        .file-time { font-size: 0.8rem; color: var(--text-muted); flex-shrink: 0; margin-left: 10px; }
        .file-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .file-actions button { flex: 1; margin-top: 0; padding: 8px; font-size: 0.85rem; }

        .token-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); background: #fff; }
        .token-item:last-child { border-bottom: none; }
        .token-info { display: flex; flex-direction: column; }
        .token-name { font-weight: bold; font-size: 0.95rem; }
        .token-type { font-size: 0.75rem; color: var(--text-muted); }
        
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; cursor: pointer; }
        .checkbox-label input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--primary); }
    </style>
    
    <script>
        const OWNER = 'tlee20860-dotcom';
        const INFRA_REPO = 'AI-infra';
        const PACKAGES_REPO = 'AI-packages';
        const WORKFLOW_ID = 'setup-structure.yml';
        const BACKUP_WORKFLOW_ID = 'copy-backup.yml';

        let pollInterval = null;
        let currentToken = '';
        let tokenList = [];
        let triggerTime = 0;

        window.onload = () => {
            loadTokens(); checkBuildStatus(); fetchFiles();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW fail:', err));
            }
        };

        // === Token 管理 ===
        function loadTokens() {
            const stored = localStorage.getItem('gh_token_list');
            if (stored) {
                try {
                    tokenList = JSON.parse(stored);
                    if (tokenList.length > 0) {
                        const active = tokenList.find(t => t.isActive);
                        currentToken = active ? active.token : tokenList[0].token;
                    }
                } catch (e) { console.error(e); }
            }
            renderTokens();
        }
        function saveTokensToLocal() { localStorage.setItem('gh_token_list', JSON.stringify(tokenList)); }
        function addToken() {
            const name = document.getElementById('new-token-name').value.trim();
            const type = document.getElementById('new-token-type').value;
            const tokenStr = document.getElementById('new-token-value').value.trim();
            if (!name || !tokenStr) return alert('請填寫名稱與 Token');
            const newToken = { id: Date.now().toString(), name, type, token: tokenStr, isActive: tokenList.length === 0 };
            tokenList.push(newToken); saveTokensToLocal();
            if (newToken.isActive) currentToken = newToken.token;
            document.getElementById('new-token-name').value = ''; document.getElementById('new-token-value').value = '';
            renderTokens();
        }
        function deleteToken(id) {
            if (!confirm('確定要刪除這組 Token 嗎？')) return;
            const tokenToDelete = tokenList.find(t => t.id === id);
            tokenList = tokenList.filter(t => t.id !== id);
            if (tokenToDelete && tokenToDelete.isActive && tokenList.length > 0) { tokenList[0].isActive = true; currentToken = tokenList[0].token; }
            else if (tokenList.length === 0) currentToken = '';
            saveTokensToLocal(); renderTokens();
        }
        function setActive(id) {
            tokenList.forEach(t => { t.isActive = (t.id === id); if (t.isActive) currentToken = t.token; });
            saveTokensToLocal(); renderTokens();
        }
        function copyToken(tokenStr) { navigator.clipboard.writeText(tokenStr).then(() => alert('已複製 Token')); }
        function renderTokens() {
            const listEl = document.getElementById('token-list');
            if (tokenList.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.9rem; padding: 10px;">目前沒有 Token，請於上方新增</div>'; return;
            }
            listEl.innerHTML = '';
            tokenList.forEach(t => {
                const item = document.createElement('div'); item.className = 'token-item';
                const masked = t.token.substring(0, 4) + '****' + t.token.substring(t.token.length - 4);
                item.innerHTML = `
                    <div class="token-info">
                        <span class="token-name">${t.name} ${t.isActive ? '✅' : ''}</span>
                        <span class="token-type">${t.type} (${masked})</span>
                    </div>
                    <div style="display:flex; gap:5px;">
                        ${!t.isActive && t.type === 'GitHub' ? `<button class="btn-primary btn-small" onclick="setActive('${t.id}')" style="padding:6px 10px; font-size:0.75rem;">啟用</button>` : ''}
                        <button class="btn-outline btn-small" onclick="copyToken('${t.token}')" style="padding:6px 10px; font-size:0.75rem; margin-top:0;">複製</button>
                        <button class="btn-danger btn-small" onclick="deleteToken('${t.id}')" style="padding:6px 10px; font-size:0.75rem;">刪除</button>
                    </div>`;
                listEl.appendChild(item);
            });
        }

        // === GitHub API ===
        async function githubAPI(url, options = {}) {
            if (!currentToken) throw new Error("未啟用 GitHub Token");
            const headers = { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `token ${currentToken}`, ...options.headers };
            const res = await fetch(`https://api.github.com${url}`, { ...options, headers });
            if (!res.ok) {
                let errMsg = `API 錯誤: ${res.status}`;
                try { const errData = await res.json(); if (errData.message) errMsg += ` - ${errData.message}`; } catch(e) {}
                if (res.status === 401) throw new Error('Token 無效或過期');
                if (res.status === 404) throw new Error('找不到資源，請確認 Repo 名稱或權限');
                throw new Error(errMsg);
            }
            return res.status === 204 ? null : await res.json();
        }

        // === 打包 ===
        async function triggerBuild() {
            const btn = document.getElementById('btn-trigger');
            btn.disabled = true; triggerTime = Date.now();
            updateStatus('build-status', 'running', '正在發送打包指令...');
            try {
                await githubAPI(`/repos/${OWNER}/${INFRA_REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ref: 'main' })
                });
                updateStatus('build-status', 'running', '指令已發送，等待 GitHub 建立新任務...');
                if (pollInterval) clearInterval(pollInterval);
                setTimeout(checkBuildStatus, 3000);
                pollInterval = setInterval(checkBuildStatus, 5000);
            } catch (error) { updateStatus('build-status', 'failure', error.message); btn.disabled = false; }
        }

        async function checkBuildStatus() {
            try {
                const data = await githubAPI(`/repos/${OWNER}/${INFRA_REPO}/actions/workflows/${WORKFLOW_ID}/runs?per_page=1`);
                if (data.workflow_runs && data.workflow_runs.length > 0) {
                    const run = data.workflow_runs[0];
                    const runTime = new Date(run.created_at).getTime();
                    const createdAt = new Date(run.created_at).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
                    
                    if (triggerTime > 0 && runTime < triggerTime - 10000) {
                        updateStatus('build-status', 'running', '指令已發送，等待 GitHub 排隊建立新任務...'); return;
                    }
                    if (run.status === 'in_progress' || run.status === 'queued') {
                        updateStatus('build-status', 'running', `打包進行中... (始於 ${createdAt})`);
                    } else if (run.conclusion === 'success') {
                        updateStatus('build-status', 'success', `上次打包成功 (${createdAt})`);
                        document.getElementById('btn-trigger').disabled = false; triggerTime = 0;
                        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; fetchFiles(); }
                    } else {
                        updateStatus('build-status', 'failure', `上次打包失敗 (${createdAt})`);
                        document.getElementById('btn-trigger').disabled = false; triggerTime = 0;
                        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
                    }
                } else { updateStatus('build-status', '', '尚無打包紀錄'); document.getElementById('btn-trigger').disabled = false; }
            } catch (error) { updateStatus('build-status', 'failure', error.message); document.getElementById('btn-trigger').disabled = false; }
        }

        // === 備份 ===
        async function triggerBackup() {
            const btn = document.getElementById('btn-backup');
            const targetRepo = document.getElementById('backup-target').value.trim();
            if (!targetRepo || !targetRepo.includes('/')) return alert('請輸入正確目標 Repo (如 tlee20860-dotcom/AI-Backup)');

            const checkboxes = document.querySelectorAll('input[name="backup-repo"]:checked');
            const repos = Array.from(checkboxes).map(cb => cb.value).join(',');
            
            if (!repos) return alert('請至少勾選一個要備份的倉庫');

            btn.disabled = true;
            updateStatus('backup-status', 'running', '正在發送備份指令...');
            
            try {
                await githubAPI(`/repos/${OWNER}/${INFRA_REPO}/actions/workflows/${BACKUP_WORKFLOW_ID}/dispatches`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ 
                        ref: 'main',
                        inputs: {
                            repos: repos,
                            target_repo: targetRepo
                        }
                    })
                });
                updateStatus('backup-status', 'success', '備份指令已發送，請稍後至 Actions 查看結果。');
                setTimeout(() => { btn.disabled = false; }, 5000);
            } catch (error) {
                updateStatus('backup-status', 'failure', error.message); 
                btn.disabled = false; 
            }
        }

        // === Pages 部署 ===
        async function triggerPagesDeploy() {
            const btn = document.getElementById('btn-deploy-pages');
            const targetRepo = document.getElementById('pages-repo').value.trim();
            const branch = document.getElementById('pages-branch').value.trim() || 'main';
            if (!targetRepo || !targetRepo.includes('/')) return alert('請輸入正確目標 Repo');
            btn.disabled = true; updateStatus('pages-status', 'running', '正在發送 Pages 部署指令...');
            try {
                await githubAPI(`/repos/${targetRepo}/actions/workflows/pages.yml/dispatches`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ref: branch })
                });
                updateStatus('pages-status', 'success', '指令已發送，請至 Actions 查看進度');
                setTimeout(() => { btn.disabled = false; }, 3000);
            } catch (error) { updateStatus('pages-status', 'failure', error.message); btn.disabled = false; }
        }

        function updateStatus(prefix, status, msg) {
            const dot = document.getElementById(`${prefix}-dot`); const text = document.getElementById(`${prefix}-text`);
            if(dot) dot.className = `status-dot ${status}`; if(text) text.textContent = msg;
        }

        // === 共享包獲取 (去重與分類) ===
        let currentFilesData = []; 

        function getCategoryInfo(filename) {
            if (/^(IP|AP|RP|UP)\.md$/.test(filename)) return { key: 'core', title: '🧠 體系四檔（核心大腦）', order: 1 };
            if (/^\d{2}-/.test(filename)) return { key: 'project', title: '📦 專案合併包', order: 2 };
            if (/^[A-Z]{1,2}P\.md$/.test(filename)) return { key: 'domain', title: '🧩 領域技能包', order: 3 };
            if (/^(03-INFRA|92-Ai-github)\.md$/.test(filename)) return { key: 'infra', title: '⚙️ 基礎設施與控制台', order: 4 };
            if (/^SP\.md$/.test(filename)) return { key: 'record', title: '📝 體系紀錄（狀態）', order: 5 };
            return { key: 'other', title: '📁 其他檔案', order: 6 };
        }

        async function fetchFiles() {
            const listEl = document.getElementById('file-list');
            listEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.9rem;">載入中...</div>';
            try {
                const data = await githubAPI(`/repos/${OWNER}/${PACKAGES_REPO}/contents/`);
                // 去重
                const uniqueFiles = Array.from(new Map(data.filter(f => f.name.endsWith('.md')).map(item => [item.name, item])).values());
                
                if (uniqueFiles.length === 0) { listEl.innerHTML = '<div style="text-align:center; color:var(--text-muted);">找不到任何 .md 檔案</div>'; return; }

                listEl.innerHTML = ''; currentFilesData = []; 
                
                // 分類群組
                const groups = {};
                for (const file of uniqueFiles) {
                    const cat = getCategoryInfo(file.name);
                    if (!groups[cat.key]) groups[cat.key] = { ...cat, files: [] };
                    groups[cat.key].files.push(file);
                }

                // 依照 order 排序並渲染
                Object.values(groups).sort((a, b) => a.order - b.order).forEach(group => {
                    const details = document.createElement('details');
                    details.className = 'file-category';
                    // 預設展開體系與專案
                    if (group.key === 'core' || group.key === 'project') details.open = true; 
                    
                    let itemsHtml = '';
                    // 群組內按檔名排序
                    group.files.sort((a, b) => a.name.localeCompare(b.name));
                    
                    for (const file of group.files) {
                        currentFilesData.push({ name: file.name, download_url: file.download_url });
                        itemsHtml += `
                            <div class="file-item">
                                <div class="file-header">
                                    <span class="file-name">${file.name}</span>
                                    <span class="file-time">大小: ${(file.size / 1024).toFixed(1)} KB</span>
                                </div>
                                <div class="file-actions">
                                    <button class="btn-primary btn-small" onclick="downloadFile('${file.download_url}', '${file.name}')">⬇️ 下載</button>
                                    <button class="btn-success btn-small" onclick="copyFileContent('${file.name}')">📋 複製</button>
                                    <button class="btn-outline btn-small" onclick="shareFile('${file.name}')">📤 分享</button>
                                </div>
                            </div>
                        `;
                    }
                    details.innerHTML = `<summary>${group.title} (${group.files.length})</summary><div class="file-category-content">${itemsHtml}</div>`;
                    listEl.appendChild(details);
                });
            } catch (error) {
                listEl.innerHTML = `<div style="text-align:center; color:var(--danger); font-size:0.9rem;">載入失敗: ${error.message}</div>`;
            }
        }

        function downloadFile(url, filename) {
            const a = document.createElement('a'); a.href = url; a.download = filename; a.target = '_blank';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        // 因為改用 fetch 下載會遇到 CORS 問題，這裡改為點擊複製時才去抓內容
        async function copyFileContent(name) {
            const file = currentFilesData.find(f => f.name === name);
            if (!file) return alert('找不到檔案資訊');
            alert('正在讀取並複製，請稍候...');
            try {
                const res = await fetch(file.download_url);
                if(!res.ok) throw new Error('網路請求失敗');
                const content = await res.text();
                await navigator.clipboard.writeText(content);
                alert(`已複製 ${name} 內容`);
            } catch(e) {
                alert('讀取或複製失敗：' + e.message);
            }
        }

        async function shareFile(name) {
            const file = currentFilesData.find(f => f.name === name);
            if (!file) return alert('找不到檔案資訊');
            if (navigator.share) {
                try {
                    const res = await fetch(file.download_url);
                    const content = await res.text();
                    await navigator.share({ title: name, text: content });
                } catch(e) { alert('分享失敗：' + e.message); }
            } else { alert('你的瀏覽器不支援原生分享功能，請使用「複製」按鈕。'); }
        }
    </script>
</head>
<body>
<div class="container">
    <h1>🚀 AI 控制台</h1>
    <div class="subtitle">共享包打包與遠端部署中心</div>

    <div class="card" id="token-section">
        <div class="card-title">🔑 憑證管理中心</div>
        <input type="text" id="new-token-name" placeholder="名稱 (如：主要 GitHub)">
        <select id="new-token-type">
            <option value="GitHub">GitHub (用於控制台操作)</option>
            <option value="OpenAI">OpenAI API Key</option>
            <option value="Gemini">Gemini API Key</option>
            <option value="Other">其他服務</option>
        </select>
        <input type="password" id="new-token-value" placeholder="Token 字串">
        <button class="btn-primary" onclick="addToken()">➕ 新增 Token</button>
        <div style="margin-top: 15px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;" id="token-list"></div>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px;">※ 只有「GitHub」類型的 Token 可以被設為啟用，用於下方控制台功能。</p>
    </div>

    <div class="card">
        <div class="card-title">📦 共享包打包</div>
        <button class="btn-primary" id="btn-trigger" onclick="triggerBuild()">▶️ 立即打包</button>
        <div class="status-box">
            <div class="status-dot" id="build-status-dot"></div>
            <div id="build-status-text">等待操作...</div>
        </div>
    </div>

    <div class="card" id="backup-section">
        <div class="card-title">💾 倉庫備份管理</div>
        <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" name="backup-repo" value="AI-kernel" checked> AI-kernel (體系核心)</label>
            <label class="checkbox-label"><input type="checkbox" name="backup-repo" value="AI-General" checked> AI-General (體系紀錄)</label>
            <label class="checkbox-label"><input type="checkbox" name="backup-repo" value="old-AI-WA-FAMILY" checked> old-AI-WA-FAMILY (專案源碼)</label>
            <label class="checkbox-label"><input type="checkbox" name="backup-repo" value="AI-OS"> AI-OS (系統)</label>
        </div>
        <input type="text" id="backup-target" placeholder="目標備份倉庫 (如 tlee20860-dotcom/AI-Backup)" value="tlee20860-dotcom/AI-Backup">
        <button class="btn-primary" id="btn-backup" onclick="triggerBackup()">🚀 開始備份</button>
        <div class="status-box">
            <div class="status-dot" id="backup-status-dot"></div>
            <div id="backup-status-text">等待操作...</div>
        </div>
    </div>

    <div class="card" id="pages-section">
        <div class="card-title">🌐 Pages 部署</div>
        <input type="text" id="pages-repo" placeholder="目標 Repo (如 tlee20860-dotcom/AI-WEB-APP-Family)" value="tlee20860-dotcom/AI-WEB-APP-Family">
        <input type="text" id="pages-branch" placeholder="分支 (預設 main)" value="main">
        <button class="btn-primary" id="btn-deploy-pages" onclick="triggerPagesDeploy()">⚡ 觸發 Pages 部署</button>
        <div class="status-box">
